<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9e1b32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="店务KPI">
<meta name="format-detection" content="telephone=no">
<title>周大福 · 店务 KPI</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
:root{
  --bg:#f6f2ea;--card:#fff;--ink:#241b18;--ink2:#6b5e56;--ink3:#a29388;
  --line:#eadfd3;--line2:#f3ece3;
  --brand:#9e1b32;--brand2:#7c1427;--brand-soft:#f7e7ea;
  --gold:#c9a227;--gold-soft:#f8efd8;
  --ok:#2f7d4f;--ok-bg:#e7f5ec;--warn:#b7791f;--warn-bg:#fdf3dc;--bad:#b42318;--bad-bg:#fdecea;
  --radius:16px;--shadow:0 2px 12px rgba(90,55,35,.07)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
@media(min-width:700px){body{box-shadow:0 0 40px rgba(90,55,35,.08)}}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}

/* 顶栏 */
.topbar{
  position:sticky;top:0;z-index:40;color:#fff;
  background:linear-gradient(135deg,#8d1429 0%,#a81d34 55%,#8d1429 100%);
  padding:calc(10px + env(safe-area-inset-top)) 14px 11px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 16px rgba(120,20,40,.22)
}
.logo{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:linear-gradient(145deg,#f0d58a,#c9a227);
  color:#6d1020;font-weight:800;font-size:10.5px;letter-spacing:.4px;
  display:grid;place-items:center;line-height:1.05;text-align:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)
}
.brandwrap{flex:1;min-width:0}
.brandwrap h1{font-size:16px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandwrap p{font-size:11.5px;opacity:.82;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbtn{
  width:34px;height:34px;border-radius:50%;flex:none;
  background:rgba(255,255,255,.14);display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.18)
}
.topbtn svg{width:19px;height:19px}

main{padding:12px 12px 0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.5}
.muted{color:var(--ink3)}
.gold{color:var(--gold)}

/* 日期条 */
.datebar{display:flex;align-items:center;gap:6px;padding:8px 8px;margin-bottom:10px}
.navbtn{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:#fbf7f1;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink2)
}
.navbtn:disabled{opacity:.35}
.datepick{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 0;cursor:pointer;min-width:0}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:pointer}
.datepick .dp-main{font-size:17px;font-weight:800;letter-spacing:.3px}
.datepick .dp-sub{font-size:11px;color:var(--ink3);margin-top:1px}
.today-btn{
  flex:none;font-size:12px;font-weight:700;color:var(--brand);
  background:var(--brand-soft);border-radius:999px;padding:7px 11px
}

/* 看板 hero */
.hero{display:flex;align-items:center;gap:15px;padding:16px 14px}
.ring{
  width:94px;height:94px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(var(--brand) var(--deg,#0deg),#f0e6da 0);
  display:grid;place-items:center;
  transition:background .4s
}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.ring-in{position:relative;z-index:1;text-align:center;line-height:1.05}
.ring-in b{display:block;font-size:25px;font-weight:800;letter-spacing:-.5px}
.ring-in span{font-size:10px;color:var(--ink3);letter-spacing:.5px}
.hero-info{flex:1;min-width:0}
.hero-title{font-size:13px;font-weight:700;color:var(--ink2)}
.hero-sub{font-size:12px;color:var(--ink3);margin-top:3px}
.hero-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.htag{font-size:10.5px;padding:3px 8px;border-radius:999px;background:#f7f1e9;color:var(--ink2)}
.htag.hot{background:var(--brand-soft);color:var(--brand);font-weight:700}

/* 预警 */
.alerts{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;margin-bottom:6px;scrollbar-width:none}
.alerts::-webkit-scrollbar{display:none}
.alert-chip{
  flex:none;font-size:11.5px;padding:6px 11px;border-radius:999px;
  background:var(--bad-bg);color:var(--bad);font-weight:600;border:1px solid #f7d4cf
}
.alert-chip.warn{background:var(--warn-bg);color:var(--warn);border-color:#f3e2bd}

/* 指标格子 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:10px 10px 9px;box-shadow:0 1px 3px rgba(90,55,35,.04)}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.tile .tn{font-size:11.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tv{font-size:16px;font-weight:800;margin-top:4px;letter-spacing:-.2px}
.tile .tv small{font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:0}
.tile .bar{height:4px;background:#f1e7db;border-radius:4px;margin-top:7px;overflow:hidden}
.tile .bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.tile.warn .bar i{background:var(--gold)}
.tile.bad .bar i{background:var(--bad)}
.tile .tfoot{font-size:9.5px;color:var(--ink3);margin-top:5px;white-space:normal;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dotbad{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:none}
.dotwarn{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.dotok{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}

/* 标题 */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:16px 3px 8px}
.sec-head h2{font-size:14px;font-weight:800}
.sec-head span{font-size:11px;color:var(--ink3)}

/* 排行 */
.rank-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.rank-row{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line2);cursor:pointer}
.rank-row:last-child{border-bottom:none}
.rank-row:active{background:#fcf8f2}
.rank-no{
  width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;color:var(--ink3);background:#f6f0e8
}
.rank-no.r1{background:linear-gradient(145deg,#f3d783,#c9a227);color:#6d1020}
.rank-no.r2{background:#e8e6e2;color:#5f5a52}
.rank-no.r3{background:#f0d9c2;color:#8a5a34}
.avatar{
  width:38px;height:38px;border-radius:50%;flex:none;
  background:linear-gradient(145deg,#f5e8d6,#e9d4ba);
  color:#8a5a34;font-weight:800;font-size:15px;display:grid;place-items:center
}
.rank-main{flex:1;min-width:0}
.rank-line{display:flex;align-items:center;gap:6px}
.rank-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-meta{font-size:10.5px;color:var(--ink3);margin-top:1px;display:flex;align-items:center;gap:5px}
.bar-track{height:5px;background:#f2e9dd;border-radius:5px;margin-top:6px;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#b01e2e,#d34a5e)}
.rank-score{flex:none;text-align:right;min-width:56px}
.rank-score b{font-size:16px;font-weight:800;letter-spacing:-.3px}
.rank-score span{display:block;font-size:9.5px;color:var(--ink3);margin-top:-1px}
.rank-score b.low{color:var(--bad)}

/* 空状态 */
.empty{padding:30px 18px;text-align:center}
.empty .em-ic{font-size:30px;margin-bottom:8px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:5px}
.empty p{font-size:12.5px;color:var(--ink3);line-height:1.6}
.empty .btn{margin-top:14px}

/* 按钮 */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:15px;
  background:#fff;border:1px solid var(--line);color:var(--ink)
}
.btn.primary{background:linear-gradient(135deg,#a81d34,#8d1429);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(158,27,50,.22)}
.btn.ghost{background:#fbf7f1;color:var(--brand);border-color:#efdcd4}
.btn.sm{padding:9px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:#f2d7d3;background:#fffafa}
.btn:active{transform:scale(.99)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* 录入 */
.entry-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px}
.entry-actions .ea-main{min-width:0}
.entry-actions b{font-size:13.5px}
.entry-actions .hint{margin-top:1px}
.mini-actions{display:flex;gap:6px;flex:none}
.mini-btn{font-size:11px;font-weight:600;padding:7px 9px;border-radius:9px;background:#fbf7f1;border:1px solid var(--line);color:var(--ink2)}
.mini-btn.danger{color:var(--bad)}
.staff-jump{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.staff-jump::-webkit-scrollbar{display:none}
.jump-chip{flex:none;font-size:11.5px;padding:6px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.entry-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 12px 11px;margin-bottom:10px;scroll-margin-top:76px}
.entry-head{display:flex;align-items:center;gap:10px;padding-bottom:11px;border-bottom:1px solid var(--line2);margin-bottom:11px}
.eh-main{flex:1;min-width:0}
.eh-main h3{font-size:15px;font-weight:800}
.eh-main p{font-size:11px;color:var(--ink3);margin-top:1px}
.eh-main p b{color:var(--brand);font-size:12.5px}
.entry-dot{width:8px;height:8px;border-radius:50%;background:#e7dccf;flex:none}
.entry-dot.ok{background:var(--ok)}
.group-label{font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:1px;margin:2px 1px 7px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric-field{
  background:#fcf9f4;border:1px solid var(--line2);border-radius:12px;
  padding:8px 9px 7px;display:flex;flex-direction:column;gap:3px;min-width:0
}
.metric-field.wide{grid-column:1/-1}
.metric-field .fl{font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;justify-content:space-between;gap:4px}
.metric-field .fl em{font-style:normal;font-size:9.5px;font-weight:600;color:var(--ink3);background:#f3ece3;border-radius:5px;padding:1px 4px;white-space:nowrap}
.input-row{display:flex;align-items:center;gap:2px}
.input-row input{
  width:100%;min-width:0;border:none;background:transparent;
  font-size:20px;font-weight:800;padding:1px 0;text-align:right;color:var(--ink);
  border-bottom:1px solid transparent;border-radius:0;outline:none;
  font-variant-numeric:tabular-nums
}
.input-row input:focus{border-bottom-color:var(--brand);background:#fff;border-radius:4px}
.input-row input::placeholder{color:#d6c9bb;font-weight:600}
.input-row .suffix{font-size:11px;color:var(--ink3);flex:none;padding-left:1px}
.state-chip{
  align-self:flex-start;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:999px;
  background:#f3ece3;color:var(--ink3);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis
}
.state-chip.ok{background:var(--ok-bg);color:var(--ok)}
.state-chip.warn{background:var(--warn-bg);color:var(--warn)}
.state-chip.bad{background:var(--bad-bg);color:var(--bad)}
.period-note{font-size:9px;color:var(--ink3);line-height:1.35;white-space:normal;display:block}
.seg-toggle{display:flex;gap:3px;background:#f1e9df;border-radius:8px;padding:2px}
.seg-toggle button{flex:1;padding:6px 2px;border-radius:6px;font-size:10.5px;font-weight:700;color:var(--ink3);white-space:nowrap}
.seg-toggle button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(90,55,35,.12)}
.seg-toggle button[data-val="1"].on{background:var(--ok-bg);color:var(--ok);box-shadow:none}
.seg-toggle button[data-val="0"].on{background:#e9e1d7;color:var(--ink2);box-shadow:none}
.review-inputs{display:flex;gap:6px}
.review-inputs label{flex:1;display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line2);border-radius:9px;padding:3px 7px;font-size:10px;color:var(--ink3);min-width:0}
.review-inputs input{width:100%;min-width:0;border:none;background:transparent;font-size:16px;font-weight:800;text-align:right;color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
.review-inputs label span{flex:none}
.entry-foot{display:flex;justify-content:flex-end;padding-top:9px}
.note-card textarea{
  width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);
  border-radius:11px;padding:10px 11px;background:#fdfbf8;font-size:14px;line-height:1.55;outline:none
}
.note-card textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.note-card label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.save-line{text-align:center;font-size:10.5px;color:var(--ink3);padding:8px 0 4px}

/* 趋势 */
.seg{display:flex;background:#efe7dc;border-radius:11px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(90,55,35,.1)}
.chart-card{padding:13px 12px 8px}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.chart-head b{font-size:13px}
.chart-head span{font-size:10.5px;color:var(--ink3)}
.chart-wrap{width:100%;overflow:hidden}
.chart-wrap svg{width:100%;height:auto;display:block;stroke:none}
.chart-empty{padding:26px 10px;text-align:center;font-size:12px;color:var(--ink3)}
.metric-bars{display:flex;flex-direction:column;gap:9px;padding:12px 13px}
.mb-row{display:flex;align-items:center;gap:8px}
.mb-name{width:74px;flex:none;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-track{flex:1;height:7px;background:#f2e9dd;border-radius:7px;overflow:hidden}
.mb-track i{display:block;height:100%;border-radius:7px;background:var(--ok)}
.mb-track i.warn{background:var(--gold)}
.mb-track i.bad{background:var(--bad)}
.mb-val{width:48px;flex:none;text-align:right;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.trend-rank{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:3px 13px}
.tr-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line2)}
.tr-row:last-child{border-bottom:none}
.tr-name{flex:1;font-size:13px;font-weight:700}
.tr-days{font-size:10px;color:var(--ink3)}
.tr-avg{font-size:14px;font-weight:800;text-align:right;min-width:54px}
.tr-avg small{font-size:9px;color:var(--ink3);font-weight:600}

/* 报表 */
.report-card{padding:0;overflow:hidden}
.report-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line2);background:#fcf8f3}
.report-head b{font-size:14px}
.report-head span{font-size:10.5px;color:var(--ink3)}
.report-pre{
  margin:0;padding:14px;font:12.5px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  white-space:pre-wrap;word-break:break-word;color:var(--ink);background:#fff;max-height:52vh;overflow:auto
}
.report-actions{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.report-tip{font-size:10.5px;color:var(--ink3);text-align:center}

/* 设置 */
.set-sec{margin-bottom:12px}
.set-sec h2{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:1px;margin:16px 3px 7px}
.set-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.set-row{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line2)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:12.5px;font-weight:600;color:var(--ink2);flex:none;width:64px}
.set-row input[type=text],.set-row input[type=number],.set-row select{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  background:#fdfbf8;font-size:13.5px;outline:none
}
.set-row input[type=text]:focus,.set-row input[type=number]:focus,.set-row select:focus{border-color:var(--brand);background:#fff}
.set-row .unit{font-size:11px;color:var(--ink3);flex:none}
.set-row .grow{flex:1}
.icon-btn{
  width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;
  color:var(--ink3);background:#f7f1e9;font-size:12px
}
.icon-btn.danger{color:var(--bad);background:var(--bad-bg)}
.switch{position:relative;width:42px;height:25px;flex:none;display:inline-block}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:999px;background:#e5d9cb;transition:.2s}
.switch span::after{
  content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;
  top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)
}
.switch input:checked + span{background:var(--brand)}
.switch input:checked + span::after{transform:translateX(17px)}
.staff-set-row{display:flex;align-items:center;gap:6px;padding:9px 11px;border-bottom:1px solid var(--line2)}
.staff-set-row:last-child{border-bottom:none}
.staff-set-row input[type=text]{flex:1;min-width:0;border:1px solid transparent;background:#fbf7f1;border-radius:8px;padding:7px 9px;font-size:13.5px;font-weight:600;outline:none}
.staff-set-row input[type=text]:focus{border-color:var(--brand);background:#fff}
.staff-set-row .off{opacity:.45}
.add-staff{display:flex;gap:7px;padding:10px 11px;border-top:1px solid var(--line2)}
.add-staff input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fdfbf8;font-size:13.5px;outline:none}
.add-staff button{flex:none;padding:0 15px;border-radius:9px;background:var(--brand);color:#fff;font-weight:700;font-size:13px}
details.metric-set{border-bottom:1px solid var(--line2)}
details.metric-set:last-child{border-bottom:none}
details.metric-set summary{
  list-style:none;display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer
}
details.metric-set summary::-webkit-details-marker{display:none}
details.metric-set summary .ms-name{flex:1;font-size:13px;font-weight:700}
details.metric-set summary .ms-meta{font-size:10.5px;color:var(--ink3);flex:none}
details.metric-set summary .chev{width:16px;height:16px;color:var(--ink3);transition:.2s}
details[open].metric-set summary .chev{transform:rotate(180deg)}

/* 底部导航 */

<script>
'use strict';

/* ================= 常量 ================= */
const APP_VERSION = '1.1.1';
const LS_KEY = 'ctf_kpi_state_v1';
const SNAP_KEY = 'ctf_kpi_snaps_v1';
const SNAP_TS_KEY = 'ctf_kpi_last_snap';
const MAX_SNAPS = 5;
const SNAP_INTERVAL = 30 * 60 * 1000;
const DEFAULT_MONTHLY_TARGET = 30; // 人均月度任务（万）
const DEFAULT_STORE_NAME = '周大福 · 厦门K11 Select店';
const LEGACY_STORE_NAMES = ['周大福 · 吕厝天虹店']; // 妈妈 2026-10-30 调店，旧店名自动换成新店名

const DEFAULT_STAFF = [
  { id:'s1', name:'叶燕红', active:true },
  { id:'s2', name:'何惠云', active:true },
  { id:'s3', name:'周燕萍', active:true },
  { id:'s4', name:'陈原昶', active:true }
];

/* 10 项 × 10 分 = 100 分
   amount：按周录金额（万），月累计 ÷ 30万 = 占比，得分 = 占比/合格线 × 10（封顶10）
   review：按周录总单数/参评单数，每周合格 2.5 分，4 周满分
   count：周二每周 2.5 分（4周满分）；CTF 每半月 5 分（2个半半月）；高珠每月 1 单满分 */
const DEFAULT_METRICS = [
  { id:'wanxiang',   name:'万相',            short:'万相',     type:'amount', threshold:13,  score:10, entry:'week',  unit:'万', enabled:true },
  { id:'chuansong',  name:'传颂',            short:'传颂',     type:'amount', threshold:10,  score:10, entry:'week',  unit:'万', enabled:true },
  { id:'sanTui',     name:'三推',            short:'三推',     type:'amount', threshold:10,  score:10, entry:'week',  unit:'万', enabled:true },
  { id:'salesTarget',name:'总销售达成',      short:'销售',     type:'amount', threshold:100, score:10, entry:'week',  unit:'万', enabled:true },
  { id:'diamond',    name:'钻石',            short:'钻石',     type:'amount', threshold:8,   score:10, entry:'week',  unit:'万', enabled:true },
  { id:'rRu',        name:'R+RU',            short:'R+RU',     type:'amount', threshold:30,  score:10, entry:'week',  unit:'万', enabled:true },
  { id:'reviewRate', name:'参评率',          short:'参评',     type:'review', threshold:80,  score:10, entry:'week',  unit:'笔', enabled:true },
  { id:'tuesdayGold',name:'周二换金破冰',    short:'换金',     type:'count',  threshold:0,   score:10, entry:'week',  unit:'次', min:1, enabled:true, weekday:2 },
  { id:'ctfFourYou', name:'CTF FOR YOU 破冰', short:'FOR YOU', type:'count',  threshold:0,   score:10, entry:'half',  unit:'单', min:1, enabled:true },
  { id:'highJewelry',name:'高珠启航',        short:'高珠',     type:'count',  threshold:0,   score:10, entry:'month', unit:'单', min:1, enabled:true }
];

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2,'0');
function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }
function weekdayCN(s){ return '日一二三四五六'[parseDate(s).getDay()]; }
function md(s){ const d=parseDate(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function mdShort(s){ const d=parseDate(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function monthKey(s){ return s.slice(0,7); }
function monthDates(s){
  const d=parseDate(s), y=d.getFullYear(), m=d.getMonth();
  const n=new Date(y,m+1,0).getDate();
  const arr=[]; for(let i=1;i<=n;i++) arr.push(y+'-'+pad2(m+1)+'-'+pad2(i));
  return arr;
}
function weekStart(s){
  const d=parseDate(s); const off=(d.getDay()+6)%7;
  d.setDate(d.getDate()-off); return fmtDate(d);
}
function weekDates(s){
  const st=weekStart(s); const arr=[];
  for(let i=0;i<7;i++) arr.push(addDays(st,i));
  return arr;
}
function monthStart(s){ return s.slice(0,7)+'-01'; }
function monthEnd(s){
  const d=parseDate(s);
  return s.slice(0,7)+'-'+pad2(new Date(d.getFullYear(), d.getMonth()+1, 0).getDate());
}
function halfStart(s){
  const d=parseDate(s);
  return s.slice(0,7)+'-'+(d.getDate()<=15?'01':'16');
}
function halfEnd(s){
  const d=parseDate(s);
  const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return s.slice(0,7)+'-'+(d.getDate()<=15?'15':pad2(last));
}
/* 按周归属：周一在哪个就月算哪个月，保证每周只统计一次 */
function monthWeeks(s){
  const mk=monthKey(s), out=[];
  for(const d of monthDates(s)){
    const ws=weekStart(d);
    if(monthKey(ws)!==mk) continue;
    if(!out.includes(ws)) out.push(ws);
  }
  return out;
}
function monthHalves(s){ return [s.slice(0,7)+'-01', s.slice(0,7)+'-16']; }
function entryKey(m, date){
  if(m.entry==='week') return weekStart(date);
  if(m.entry==='half') return halfStart(date);
  if(m.entry==='month') return monthStart(date);
  return date;
}
function weekLabel(date){
  const ws=weekStart(date);
  return mdShort(ws)+'–'+mdShort(addDays(ws,6));
}
function halfLabel(date){ return mdShort(halfStart(date))+'–'+mdShort(halfEnd(date)); }
function round1(n){ return Math.round((Number(n)||0)*10)/10; }
function monthlyTarget(){
  const v=Number(S && S.monthlyTarget);
  return v>0 ? v : DEFAULT_MONTHLY_TARGET;
}
function periodLabel(m){
  if(m.type==='amount') return '按周录';
  if(m.type==='review') return '按周录';
  if(m.entry==='week') return '每周';
  if(m.entry==='half') return '每半月';
  if(m.entry==='month') return '每月';
  return '每日';
}
function periodTag(m){
  if(m.entry==='half') return '本半月';
  if(m.entry==='month') return '本月';
  return '本周';
}
function metricMetaText(m){
  let rule;
  if(m.type==='amount') rule='≥'+m.threshold+'%';
  else if(m.type==='review') rule='每周≥'+m.threshold+'%';
  else rule='≥'+(m.min||1)+(m.unit||'');
  const base = periodLabel(m)+' · '+rule+' · '+(m.score?(m.score+'分'):'仅监测');
  return m.enabled ? base : base+' · 已停用';
}
function updateMetricMeta(m){
  const details = document.querySelector('details.metric-set[data-metric="'+m.id+'"]');
  if(!details) return;
  const el = details.querySelector('.ms-meta');
  if(el) el.textContent = metricMetaText(m);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt1(n){
  if(n==null || isNaN(n)) return '—';
  const v=Number(n);
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}
function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function clamp(n,min,max){ return Math.min(max,Math.max(min,n)); }
function normalizeStoreName(name){
  const n = String(name||'').trim();
  if(!n) return DEFAULT_STORE_NAME;
  return LEGACY_STORE_NAMES.includes(n) ? DEFAULT_STORE_NAME : n;
}

/* ================= 状态 ================= */
function defaultState(){
  return {
    version: 2,
    storeName: DEFAULT_STORE_NAME,
    monthlyTarget: DEFAULT_MONTHLY_TARGET,
    staff: DEFAULT_STAFF.map(x=>({...x})),
    metrics: DEFAULT_METRICS.map(x=>({...x})),
    records: {},
    notes: {},
    meta: { createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() }
  };
}

/* 旧版（1.0）数据迁移：
   - 金额类旧值是百分比，按 30 万折成金额，放到对应周
   - 参评率旧值折成「100 笔里参评 N 笔」
   - 破冰类 1/0 保留，放到对应周/半月/月 */
function convertLegacyRecords(records, target){
  const out = {};
  if(!records || typeof records!=='object') return out;
  for(const date of Object.keys(records).sort()){
    const day = records[date];
    if(!day || typeof day!=='object') continue;
    for(const sid of Object.keys(day)){
      const rec = day[sid];
      if(!rec || typeof rec!=='object') continue;
      for(const mid of Object.keys(rec)){
        const raw = rec[mid];
        if(raw===undefined || raw===null || raw==='') continue;
        const m = DEFAULT_METRICS.find(x=>x.id===mid);
        if(!m) continue;
        let key = date, val = raw;
        if(m.type==='amount'){
          const n = Number(raw);
          if(!isFinite(n)) continue;
          val = Math.round(n*target/100*100)/100;
          key = weekStart(date);
        }else if(m.type==='review'){
          const n = clamp(Number(raw)||0, 0, 100);
          val = { total:100, reviewed:n };
          key = weekStart(date);
        }else if(m.type==='count'){
          val = Number(raw)||0;
          key = m.entry==='week' ? weekStart(date) : m.entry==='half' ? halfStart(date) : monthStart(date);
        }else{
          const n = Number(raw);
          if(!isFinite(n)) continue;
          val = n;
        }
        if(!out[key]) out[key] = {};
        if(!out[key][sid]) out[key][sid] = {};
        out[key][sid][mid] = val;
      }
    }
  }
  return out;
}

function migrateState(raw){
  const out = defaultState();
  if(!raw || typeof raw !== 'object') return out;
  const legacyVersion = Number(raw.version)||1;
  if(typeof raw.storeName === 'string' && raw.storeName.trim()) out.storeName = normalizeStoreName(raw.storeName);
  if(Number.isFinite(Number(raw.monthlyTarget)) && Number(raw.monthlyTarget)>0){
    out.monthlyTarget = Number(raw.monthlyTarget);
  }
  if(Array.isArray(raw.staff) && raw.staff.length){
    out.staff = raw.staff
      .filter(s=>s && typeof s.name === 'string')
      .map((s,i)=>({ id:String(s.id||('s'+(i+1))), name:s.name.slice(0,20), active:s.active!==false }));
  }
  const savedMetrics = Array.isArray(raw.metrics) ? raw.metrics : [];
  out.metrics = DEFAULT_METRICS.map(dm=>{
    const sm = savedMetrics.find(x=>x && x.id===dm.id);
    if(!sm) return {...dm};
    return {
      ...dm,
      enabled: sm.enabled!==false,
      threshold: Number.isFinite(Number(sm.threshold)) ? Number(sm.threshold) : dm.threshold,
      score: Number.isFinite(Number(sm.score)) ? Number(sm.score) : dm.score,
      min: Number.isFinite(Number(sm.min)) ? Number(sm.min) : dm.min
    };
  });
  const rawRecords = (raw.records && typeof raw.records==='object') ? raw.records : {};
  out.records = legacyVersion < 2 ? convertLegacyRecords(rawRecords, out.monthlyTarget) : rawRecords;
  out.notes = (raw.notes && typeof raw.notes==='object') ? raw.notes : {};
  out.meta = Object.assign(out.meta, raw.meta||{});
  out.version = 2;
  return out;
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const st = migrateState(parsed);
      if((Number(parsed.version)||1) < 2 || st.storeName !== parsed.storeName){
        try{ localStorage.setItem(LS_KEY, JSON.stringify(st)); }catch(e){}
      }
      return st;
    }
  }catch(e){ console.warn('读取本地数据失败', e); }
  return defaultState();
}

let S = loadState();
let ui = {
  tab: 'dash',
  date: todayStr(),
  range: 7,
  reportType: 'day'
};
let saveTimer = null;

function saveNow(){
  clearTimeout(saveTimer); saveTimer=null;
  S.meta.updatedAt = new Date().toISOString();
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(S));
  }catch(e){
    console.warn(e);
    toast('保存失败，手机存储空间可能满了，请先导出备份');
  }
  maybeSnapshot();
  updateSaveLine();
}
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 350);
}
function updateSaveLine(){
  const el = $('#lastSaved');
  if(el) el.textContent = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
function getSnaps(){
  try{ return JSON.parse(localStorage.getItem(SNAP_KEY)||'[]'); }catch(e){ return []; }
}
function maybeSnapshot(force){
  const now = Date.now();
  const last = Number(localStorage.getItem(SNAP_TS_KEY)||0);
  if(!force && now-last < SNAP_INTERVAL) return;
  try{
    const snaps = getSnaps();
    snaps.unshift({ t:now, data:JSON.stringify(S) });
    while(snaps.length > MAX_SNAPS) snaps.pop();
    localStorage.setItem(SNAP_KEY, JSON.stringify(snaps));
    localStorage.setItem(SNAP_TS_KEY, String(now));
  }catch(e){ console.warn('快照失败', e); }
}

/* ================= 数据读写 ================= */
function findStaff(id){ return S.staff.find(s=>s.id===id); }
function findMetric(id){ return S.metrics.find(m=>m.id===id); }
function getRec(date, staffId, metricId){
  const d = S.records[date];
  if(!d || !d[staffId]) return undefined;
  return d[staffId][metricId];
}
function setRec(date, staffId, metricId, val){
  if(!S.records[date]) S.records[date] = {};
  if(!S.records[date][staffId]) S.records[date][staffId] = {};
  if(val===null || val===undefined || val==='' || (typeof val==='number' && isNaN(val))){
    delete S.records[date][staffId][metricId];
  }else{
    S.records[date][staffId][metricId] = val;
  }
  if(Object.keys(S.records[date][staffId]).length===0) delete S.records[date][staffId];
  if(Object.keys(S.records[date]).length===0) delete S.records[date];
}
function hasAnyEntry(staffId, date){
  return S.metrics.some(m=>{
    if(!m.enabled) return false;
    const st = metricState(staffId, m, date);
    if(m.type==='review') return (st.weeksRecorded||0) > 0;
    return st.value!==null && st.value!==undefined;
  });
}

/* 指标在某个日期的“本月累计”状态 */
function metricState(staffId, metric, date){
  if(!metric.enabled) return { status:'off', pass:null, value:null, date:null };

  if(metric.type==='amount'){
    const base = monthlyTarget();
    const weeks = monthWeeks(date).filter(ws=>ws<=date);
    let total = 0, has = false;
    for(const ws of weeks){
      const v = getRec(ws, staffId, metric.id);
      if(v!==undefined && v!==null && v!==''){ total += Number(v)||0; has = true; }
    }
    const weekRaw = getRec(weekStart(date), staffId, metric.id);
    const weekValue = (weekRaw===undefined||weekRaw===null||weekRaw==='') ? null : Number(weekRaw)||0;
    const ratio = (has && base>0) ? total/base*100 : null;
    const pass = ratio!==null && ratio >= metric.threshold;
    return {
      status: has ? (pass?'pass':'fail') : 'pending',
      pass, value: has?total:null, ratio, weekValue,
      weeksRecorded: weeks.filter(ws=>getRec(ws,staffId,metric.id)!=null).length,
      date: weekStart(date)
    };
  }

  if(metric.type==='review'){
    const accum = (list) => {
      let total=0, reviewed=0, weeksPassed=0, weeksRecorded=0;
      for(const ws of list){
        const v = getRec(ws, staffId, metric.id);
        if(v && typeof v==='object'){
          const t = Number(v.total)||0, r = Number(v.reviewed)||0;
          if(t>0 || r>0){
            weeksRecorded++; total += t; reviewed += r;
            if(t>0 && r/t*100 >= metric.threshold) weeksPassed++;
          }
        }
      }
      return { total, reviewed, weeksPassed, weeksRecorded, ratio: total>0 ? reviewed/total*100 : null };
    };
    const allWeeks = monthWeeks(date);
    const cum = accum(allWeeks.filter(ws=>ws<=date));   // 截止输入周
    const month = accum(allWeeks);                       // 整月（含已录入的其他周）
    const curRaw = getRec(weekStart(date), staffId, metric.id);
    const cur = (curRaw && typeof curRaw==='object')
      ? { total:Number(curRaw.total)||0, reviewed:Number(curRaw.reviewed)||0 }
      : { total:0, reviewed:0 };
    const ratio = cum.ratio;
    const weekRatio = cur.total>0 ? cur.reviewed/cur.total*100 : null;
    const pass = ratio!==null && ratio >= metric.threshold;
    return {
      status: cum.weeksRecorded ? (pass?'pass':'fail') : 'pending',
      pass, value: ratio, ratio, reviewed: cum.reviewed, total: cum.total, weekRatio,
      weeksPassed: cum.weeksPassed, weeksRecorded: cum.weeksRecorded,
      monthRatio: month.ratio, monthReviewed: month.reviewed, monthTotal: month.total,
      monthWeeksPassed: month.weeksPassed, monthWeeksRecorded: month.weeksRecorded,
      weekValue: cur, date: weekStart(date)
    };
  }

  if(metric.type==='count'){
    const min = Number(metric.min)||1;
    if(metric.entry==='week'){
      const weeks = monthWeeks(date).filter(ws=>ws<=date);
      let passed=0, recorded=0, sum=0;
      for(const ws of weeks){
        const v = getRec(ws, staffId, metric.id);
        if(v!==undefined && v!==null && v!==''){
          recorded++; sum += Number(v)||0;
          if(Number(v)>=min) passed++;
        }
      }
      const curRaw = getRec(weekStart(date), staffId, metric.id);
      const weekValue = (curRaw===undefined||curRaw===null||curRaw==='') ? null : Number(curRaw)||0;
      return {
        status: passed>=4 ? 'pass' : (recorded?'fail':'pending'),
        pass: passed>=4, value: recorded?sum:null, periodsPassed:passed, periodsTotal:4,
        weekValue, date: weekStart(date)
      };
    }
    if(metric.entry==='half'){
      const halves = monthHalves(date).filter(hs=>hs<=date);
      let passed=0, recorded=0, sum=0;
      for(const hs of halves){
        const v = getRec(hs, staffId, metric.id);
        if(v!==undefined && v!==null && v!==''){
          recorded++; sum += Number(v)||0;
          if(Number(v)>=min) passed++;
        }
      }
      const curRaw = getRec(halfStart(date), staffId, metric.id);
      const halfValue = (curRaw===undefined||curRaw===null||curRaw==='') ? null : Number(curRaw)||0;
      return {
        status: passed>=2 ? 'pass' : (recorded?'fail':'pending'),
        pass: passed>=2, value: recorded?sum:null, periodsPassed:passed, periodsTotal:2,
        halfValue, date: halfStart(date)
      };
    }
    const key = monthStart(date);
    const raw = getRec(key, staffId, metric.id);
    const v = (raw===undefined||raw===null||raw==='') ? null : Number(raw)||0;
    const pass = v!==null && v>=min;
    return {
      status: v===null ? 'pending' : (pass?'pass':'fail'),
      pass, value: v, periodsPassed: pass?1:0, periodsTotal:1,
      monthValue: v, date: key
    };
  }

  // 兼容旧的比例类
  const v = getRec(date, staffId, metric.id);
  if(v===undefined || v===null) return { status:'pending', pass:null, value:null, date:null };
  const pass = Number(v) >= metric.threshold;
  return { status:pass?'pass':'fail', pass, value:Number(v), ratio:Number(v), date };
}

/* 计分：金额按完成比例折算，破冰按已完成的周/半月给分 */
function metricScore(metric, st){
  const max = Number(metric.score)||0;
  if(!max || !metric.enabled || !st) return 0;
  if(metric.type==='amount'){
    if(st.ratio===null || st.ratio===undefined || !(Number(metric.threshold)>0)) return 0;
    return round1(clamp(st.ratio/Number(metric.threshold)*max, 0, max));
  }
  if(metric.type==='review'){
    return round1(clamp((st.weeksPassed||0)/4*max, 0, max));
  }
  if(metric.type==='count'){
    if(metric.entry==='week') return round1(clamp((st.periodsPassed||0)/4*max, 0, max));
    if(metric.entry==='half') return round1(clamp((st.periodsPassed||0)/2*max, 0, max));
    return st.pass ? max : 0;
  }
  if(metric.type==='ratio') return st.pass ? max : 0;
  return 0;
}
function isFullScore(metric, st){
  const max = Number(metric.score)||0;
  return max>0 && metricScore(metric, st) >= max-0.001;
}

function staffDaily(staffId, date){
  const metrics = S.metrics.filter(m=>m.enabled);
  const items = metrics.map(m=>{
    const st = metricState(staffId, m, date);
    return { m, st, score: metricScore(m, st), full: isFullScore(m, st) };
  });
  const score = round1(items.reduce((a,x)=>a+x.score, 0));
  const max = metrics.reduce((a,m)=>a + (Number(m.score)||0), 0);
  const passCount = items.filter(x=>x.full).length;
  const failCount = items.filter(x=>!x.full && x.st.status==='fail').length;
  const pendingCount = items.filter(x=>x.st.status==='pending').length;
  return {
    items, score, max, passCount, failCount, pendingCount,
    total: metrics.length,
    recorded: hasAnyEntry(staffId, date)
  };
}

function storeStats(date){
  const active = S.staff.filter(s=>s.active);
  const per = active.map(s=>({ s, d:staffDaily(s.id, date) }));
  const metrics = S.metrics.filter(m=>m.enabled).map(m=>{
    let full=0, partial=0, pending=0;
    let sum=0, reviewed=0, totalOrders=0, periods=0;
    let monthReviewed=0, monthTotalOrders=0;
    for(const p of per){
      const it = p.d.items.find(x=>x.m.id===m.id);
      if(!it) continue;
      if(it.full) full++;
      else if(it.score>0 || it.st.status==='fail') partial++;
      else pending++;
      if(m.type==='amount' && it.st.value!=null) sum += it.st.value;
      if(m.type==='review'){
        reviewed += it.st.reviewed||0;
        totalOrders += it.st.total||0;
        periods += it.st.weeksPassed||0;
        monthReviewed += it.st.monthReviewed||0;
        monthTotalOrders += it.st.monthTotal||0;
      }
      if(m.type==='count'){ sum += it.st.value||0; periods += it.st.periodsPassed||0; }
    }
    return {
      m, pass:full, full, partial, pending,
      sum, reviewed, totalOrders, periods, monthReviewed, monthTotalOrders,
      ratio: (m.type==='amount' && active.length && monthlyTarget()>0)
        ? sum/(monthlyTarget()*active.length)*100 : null
    };
  });
  const maxScore = S.metrics.filter(m=>m.enabled).reduce((a,m)=>a+(Number(m.score)||0),0);
  const avg = mean(per.map(p=>p.d.score));
  const passCount = per.reduce((a,p)=>a+p.d.passCount,0);
  const totalCount = per.reduce((a,p)=>a+p.d.total,0);
  const recorded = per.filter(p=>p.d.recorded).length;
  return { active, per, metrics, maxScore, avg, passCount, totalCount, recorded };
}

function reportRange(type, anchor){
  const today = todayStr();
  if(type==='day') return [anchor];
  if(type==='week'){
    const ws = weekStart(anchor);
    const arr = [];
    for(let i=0;i<7;i++){
      const d = addDays(ws,i);
      if(d<=today) arr.push(d);
    }
    return arr;
  }
  return monthDates(anchor).filter(d=>d<=today);
}

function metricRates(rows, active){
  const at = rows.length ? rows[rows.length-1].d : ui.date;
  return S.metrics.filter(m=>m.enabled).map(m=>{
    let pass=0, total=0, prog=0;
    const max = Number(m.score)||0;
    for(const s of active){
      const st = metricState(s.id, m, at);
      const sc = metricScore(m, st);
      total++;
      if(max>0 && sc >= max-0.001) pass++;
      prog += max>0 ? sc/max : 0;
    }
    return { m, pass, total, progress: total ? prog/total : 0 };
  });
}

function rangeSummary(type, anchor){
  const dates = reportRange(type, anchor);
  const rows = dates.map(d=>({ d, st:storeStats(d) })).filter(x=>x.st.recorded>0);
  const active = S.staff.filter(s=>s.active);
  const metricStats = rows.length ? metricRates(rows, active) : [];
  const per = active.map(s=>{
    const ds = rows.map(r=>({ d:r.d, dly:staffDaily(s.id, r.d) })).filter(x=>x.dly.recorded);
    return { s, days:ds.length, avg:mean(ds.map(x=>x.dly.score)), max:storeStats(rows.length?rows[rows.length-1].d:anchor).maxScore };
  }).sort((a,b)=>b.avg-a.avg || a.s.name.localeCompare(b.s.name,'zh'));
  const best = rows.slice().sort((a,b)=>b.st.avg-a.st.avg)[0] || null;
  return { dates, rows, active, metricStats, per, avg:mean(rows.map(r=>r.st.avg)), best };
}

/* ================= 渲染 ================= */
const NAV = ['dash','entry','trend','report','set'];

function setTab(tab){
  if(!NAV.includes(tab)) return;
  ui.tab = tab;
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

function render(){
  $('#storeName').textContent = S.storeName;
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
  const app = $('#app');
  let html = '';
  if(ui.tab==='dash') html = viewDash();
  else if(ui.tab==='entry') html = viewEntry();
  else if(ui.tab==='trend') html = viewTrend();
  else if(ui.tab==='report') html = viewReport();
  else html = viewSettings();
  app.innerHTML = html;
}

function dateBar(){
  const d = parseDate(ui.date);
  const isT = ui.date===todayStr();
  return `
  <div class="datebar card">
    <button class="navbtn" data-act="shift-date" data-delta="-1" aria-label="前一天">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>

function tileFoot(x, activeN){
  const m = x.m;
  if(m.type==='amount'){
    return '全店 '+fmt1(x.sum)+'万 · 合格'+m.threshold+'%';
  }
  if(m.type==='review'){
    const r = x.monthTotalOrders ? x.monthReviewed/x.monthTotalOrders*100 : null;
    return '本月 '+(r===null?'—':fmt1(r)+'%')+' · ≥'+m.threshold+'%';
  }
  if(m.entry==='week') return '全店 '+x.periods+'/'+(activeN*4)+' 周次 · 每周2.5分';
  if(m.entry==='half') return '全店 '+x.periods+'/'+(activeN*2)+' 半月次 · 每半月5分';
  return '本月 '+fmt1(x.sum)+' 单 · 每月1单满分';
}

function viewDash(){
  const st = storeStats(ui.date);
  const max = st.maxScore || 1;
  const pct = Math.round(st.avg/max*100);
  const activeN = st.active.length;
  const hasData = st.recorded > 0;
  const monthText = (parseDate(ui.date).getMonth()+1)+'月';
  const alerts = hasData ? st.metrics
    .filter(x=>x.full<activeN)
    .map(x=>({ x, miss: activeN-x.full }))
    .sort((a,b)=>b.miss-a.miss)
    .slice(0,5) : [];
  const ranks = st.per.slice().sort((a,b)=>b.d.score-a.d.score || a.s.name.localeCompare(b.s.name,'zh'));
  const note = (S.notes[ui.date]||'').trim();

  const tiles = st.metrics.map(x=>{
    const rate = activeN ? x.full/activeN : 0;
    const cls = x.full===activeN ? '' : (x.full===0 ? 'bad' : 'warn');
    const dot = x.full===activeN ? 'dotok' : (x.full===0 ? 'dotbad' : 'dotwarn');
    return `
    <div class="tile ${cls}">
      <div class="tile-top">
        <span class="tn">${esc(x.m.short||x.m.name)}</span>
        <span class="${dot}"></span>
      </div>
      <div class="tv">${x.full}<small>/${activeN}人</small></div>
      <div class="bar"><i style="width:${Math.round(rate*100)}%"></i></div>
      <div class="tfoot">${tileFoot(x, activeN)}</div>
    </div>`;
  }).join('');

  const rankRows = ranks.map((p,i)=>{
    const d = p.d;
    const wpct = d.max ? Math.round(d.score/d.max*100) : 0;
    const medal = i===0?'r1':i===1?'r2':i===2?'r3':'';
    const low = d.recorded && d.score < d.max*0.6;
    return `
    <div class="rank-row" data-act="staff-detail" data-staff="${p.s.id}">
      <span class="rank-no ${medal}">${i+1}</span>
      <span class="avatar">${esc(p.s.name.slice(0,1))}</span>
      <div class="rank-main">
        <div class="rank-line"><span class="rank-name">${esc(p.s.name)}</span></div>
        <div class="rank-meta">
          ${d.recorded?'本月已录':'<span style="color:#c0892b">未录</span>'}
          <span>· 满分 ${d.passCount}/${d.total} 项</span>
        </div>
        <div class="bar-track"><i style="width:${wpct}%"></i></div>
      </div>
      <div class="rank-score"><b class="${low?'low':''}">${d.recorded?fmt1(d.score):'—'}</b><span>/ ${d.max} 分</span></div>
    </div>`;
  }).join('');

  return `
  ${dateBar()}
  <section class="card hero">
    <div class="ring" style="--deg:${pct*3.6}deg">
      <div class="ring-in"><b>${st.recorded?fmt1(st.avg):'—'}</b><span>全店月均分</span></div>
    </div>
    <div class="hero-info">
      <div class="hero-title">${monthText} KPI 概览</div>
      <div class="hero-sub">${st.recorded}/${activeN} 人已录 · 满分项 ${st.passCount}/${st.totalCount}</div>
      <div class="hero-tags">
        <span class="htag${st.recorded<activeN?' hot':''}">${st.recorded<activeN?'还差 '+(activeN-st.recorded)+' 人未录':'全员已录'}</span>
        <span class="htag">满分 ${st.maxScore} 分</span>
        <span class="htag">人均任务 ${fmt1(monthlyTarget())} 万</span>
        ${note?'<span class="htag hot">有备注</span>':''}
      </div>
    </div>
  </section>
  ${alerts.length?`<div class="alerts">${alerts.map(a=>{
    const parts=[];
    if(a.x.pending) parts.push(a.x.pending+'人未录');
    if(a.x.partial) parts.push(a.x.partial+'人未满');
    if(!parts.length) parts.push(a.miss+'人未得分');
    return `<span class="alert-chip ${a.x.full?'warn':''}">${esc(a.x.m.short)} ${parts.join(' · ')}</span>`;
  }).join('')}</div>`:''}
  <div class="tiles">${tiles}</div>
  ${hasData?`
  <div class="sec-head"><h2>店员排行</h2><span>按本月得分</span></div>
  <div class="rank-list">${rankRows || '<div class="empty"><p>还没有店员，去设置里添加</p></div>'}</div>`:''}
  ${!st.recorded?`
  <div class="card empty" style="margin-top:10px">
    <div class="em-ic">📝</div>
    <h3>${monthText}还没有记录</h3>
    <p>按周录入金额和破冰情况，系统自动累计本月、折算占比和得分。</p>
    <button class="btn primary" data-act="goto-entry">去录入</button>
  </div>`:`
  <div class="btn-row" style="margin-top:10px">
    <button class="btn primary" data-act="goto-entry">继续录入</button>
    <button class="btn" data-act="goto-report">生成月报</button>
  </div>`}
  ${note?`<div class="card" style="margin-top:10px;padding:11px 13px"><div class="hint" style="margin-bottom:4px">当日备注</div><div style="font-size:12.5px;white-space:pre-wrap">${esc(note)}</div></div>`:''}
  `;
}

function entryFieldHTML(s, m){
  const st = metricState(s.id, m, ui.date);
  const score = metricScore(m, st);
  const chip = chipInfo(m, st, score);
  const note = periodNote(m, st);

  if(m.type==='amount'){
    const val = st.weekValue===null ? '' : st.weekValue;
    return `
    <label class="metric-field" data-field="${s.id}:${m.id}">
      <span class="fl">${esc(m.short||m.name)}<em>本周 · ≥${m.threshold}%</em></span>
      <span class="input-row">
        <input type="number" inputmode="decimal" step="0.1" min="0" max="9999" placeholder="—"
          value="${val}" data-in="amount" data-staff="${s.id}" data-metric="${m.id}">
        <span class="suffix">万</span>
      </span>
      <span class="period-note" data-note>${note}</span>
      <span class="state-chip ${chip.cls}" data-chip>${chip.text}</span>
    </label>`;
  }

  if(m.type==='review'){
    const cur = st.weekValue || {total:0, reviewed:0};
    return `
    <div class="metric-field wide" data-field="${s.id}:${m.id}">
      <span class="fl">${esc(m.name)}<em>本周 · ≥${m.threshold}%</em></span>
      <div class="review-inputs">
        <label><span>总单</span><input type="number" inputmode="numeric" min="0" max="9999" placeholder="—"
          value="${cur.total||''}" data-in="reviewTotal" data-staff="${s.id}" data-metric="${m.id}"><span>笔</span></label>
        <label><span>参评</span><input type="number" inputmode="numeric" min="0" max="9999" placeholder="—"
          value="${cur.reviewed||''}" data-in="reviewReviewed" data-staff="${s.id}" data-metric="${m.id}"><span>笔</span></label>
      </div>
      <span class="period-note" data-note>${note}</span>
      <span class="state-chip ${chip.cls}" data-chip>${chip.text}</span>
    </div>`;
  }

  // 破冰计数
  let val = '';
  if(m.entry==='week' && st.weekValue!==null) val = st.weekValue;
  else if(m.entry==='half' && st.halfValue!==null) val = st.halfValue;
  else if(m.entry==='month' && st.monthValue!==null) val = st.monthValue;
  const tag = m.entry==='week' ? '本周' : m.entry==='half' ? '本半月' : '本月';
  return `
  <div class="metric-field wide" data-field="${s.id}:${m.id}">
    <span class="fl">${esc(m.name)}<em>${tag} · ≥${m.min||1}${m.unit||'次'}</em></span>
    <span class="input-row">
      <input type="number" inputmode="numeric" step="1" min="0" max="999" placeholder="—"
        value="${val}" data-in="count" data-staff="${s.id}" data-metric="${m.id}">
      <span class="suffix">${m.unit||'次'}</span>
    </span>
    <span class="period-note" data-note>${note}</span>
    <span class="state-chip ${chip.cls}" data-chip>${chip.text}</span>
  </div>`;
}

function chipInfo(m, st, score){
  const max = Number(m.score)||0;
  const val = score===undefined ? metricScore(m, st) : score;
  let cls = '';
  if(max>0){
    if(val >= max-0.001) cls = 'ok';
    else if(val > 0) cls = 'warn';
    else if(st.status!=='pending') cls = 'bad';
  }
  let text = '';
  if(m.type==='amount'){
    if(st.ratio===null || st.ratio===undefined){
      text = '得分 0/'+max;
    }else if(st.ratio >= m.threshold){
      text = '占比 '+fmt1(st.ratio)+'% · 得分 '+fmt1(val)+'/'+max;
    }else{
      const shortAmt = (m.threshold-st.ratio)/100*monthlyTarget();
      text = '得分 '+fmt1(val)+'/'+max+' · 差'+fmt1(shortAmt)+'万';
    }
  }else if(m.type==='review'){
    text = '得分 '+fmt1(val)+'/'+max;
  }else if(m.type==='count'){
    if(st.status==='pending') text = '未录';
    else text = (st.pass?'已破冰':'未满分')+' · 得分 '+fmt1(val)+'/'+max;
  }else{
    text = st.pass ? '达标' : '未达标';
  }
  return { cls, text };
}

function periodNote(m, st){
  if(m.type==='amount'){
    const parts = [];
    parts.push(st.value===null ? '本月未录' : '本月 '+fmt1(st.value)+'万');
    parts.push(st.ratio===null ? '占比 —' : '占比 '+fmt1(st.ratio)+'%');
    if(monthKey(weekStart(ui.date))!==monthKey(ui.date)){
      parts.push('本周计入'+(parseDate(weekStart(ui.date)).getMonth()+1)+'月');
    }
    return parts.join(' · ');
  }
  if(m.type==='review'){
    const parts = [];
    parts.push(st.weekRatio===null ? '本周未录' : '本周 '+fmt1(st.weekRatio)+'%');
    parts.push(st.ratio===null ? '截止 —' : '截止 '+fmt1(st.ratio)+'%');
    parts.push(st.monthRatio===null ? '本月 —' : '本月 '+fmt1(st.monthRatio)+'%');
    parts.push('已合格 '+(st.weeksPassed||0)+'/4 周');
    return parts.join(' · ');
  }
  if(m.entry==='week'){
    return '本月 '+(st.periodsPassed||0)+'/4 周 · 本周 '+(st.weekValue===null?'未录':fmt1(st.weekValue)+'次');
  }
  if(m.entry==='half'){
    return '本月 '+(st.periodsPassed||0)+'/2 半月 · 本半月 '+(st.halfValue===null?'未录':fmt1(st.halfValue)+'单');
  }
  return '本月 '+(st.monthValue===null?'未录':fmt1(st.monthValue)+'单');
}

function viewTrend(){
  const range = ui.range;
  const today = todayStr();
  let dates;
  if(range==='month'){
    dates = monthDates(ui.date).filter(d=>d<=today);
  }else{
    const n = range;
    dates = [];
    for(let i=n-1;i>=0;i--) dates.push(addDays(today,i));
  }
  const rows = dates.map(d=>({ d, st:storeStats(d) })).filter(x=>x.st.recorded>0);
  const maxScore = S.metrics.filter(m=>m.enabled).reduce((a,m)=>a+(Number(m.score)||0),0) || 1;

  let chart = '';
  if(rows.length>=2){
    chart = lineChart(rows, maxScore);
  }else if(rows.length===1){
    chart = `<div class="chart-empty">本月累计均分 <b style="font-size:20px;color:var(--brand)">${fmt1(rows[0].st.avg)}</b> / ${maxScore} 分<br><span style="font-size:10.5px">再录几周就能看到趋势线</span></div>`;
  }else{
    chart = '<div class="chart-empty">这段时间还没有记录<br><span style="font-size:10.5px">先去录几周，趋势会自动出来</span></div>';
  }

  const metricBars = (rows.length ? metricRates(rows, S.staff.filter(x=>x.active)) : []).map(x=>{
    const rate = x.progress||0;
    const cls = rate>=0.8?'':(rate>=0.5?'warn':'bad');
    return `
    <div class="mb-row">
      <span class="mb-name">${esc(x.m.short||x.m.name)}</span>
      <span class="mb-track"><i class="${cls}" style="width:${Math.round(rate*100)}%"></i></span>
      <span class="mb-val">${Math.round(rate*100)}%</span>
    </div>`;
  }).join('');

  const active = S.staff.filter(s=>s.active);
  const rank = active.map(s=>{
    const ds = rows.map(r=>({ d:r.d, dly:staffDaily(s.id,r.d) })).filter(x=>x.dly.recorded);
    const last = ds[ds.length-1];
    return { s, days:ds.length, score:last?last.dly.score:0, has:!!last };
  }).sort((a,b)=>b.score-a.score);

  return `

  </div>
  <div class="card chart-card">
    <div class="chart-head"><b>全店月累计均分</b><span>满分 ${maxScore} 分</span></div>
    <div class="chart-wrap">${chart}</div>
  </div>
  <div class="sec-head"><h2>指标得分进度</h2><span>${rows.length} 天有记录</span></div>
  <div class="card metric-bars">${rows.length?metricBars:'<div class="chart-empty" style="padding:14px">暂无数据</div>'}</div>
  <div class="sec-head"><h2>店员排名</h2><span>按最新本月得分</span></div>
  <div class="trend-rank">
    ${rank.map((r,i)=>`
      <div class="tr-row">
        <span class="rank-no ${i===0?'r1':i===1?'r2':i===2?'r3':''}">${i+1}</span>
        <span class="tr-name">${esc(r.s.name)} <span class="tr-days">${r.days}天有录</span></span>
        <span class="tr-avg">${r.has?fmt1(r.score):'—'}<small> 分</small></span>
      </div>`).join('')}
  </div>
  <div class="tip-box" style="margin-bottom:12px">提示：得分是本月累计值，会随每周录入逐步增加；金额类按「完成占比 ÷ 合格线 × 10 分」折算。</div>
  `;
}

function lineChart(rows, maxScore){
  const W=340, H=150, P=24;
  const n = rows.length;
  const xs = i => P + (W-2*P) * (n===1?0.5:i/(n-1));
  const ys = v => H-P - (clamp(v,0,maxScore)/maxScore) * (H-2*P);
  const pts = rows.map((r,i)=>({ x:xs(i), y:ys(r.st.avg), v:r.st.avg, d:r.d }));
  const line = pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `M${pts[0].x.toFixed(1)},${H-P} L${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} ` +
    pts.slice(1).map(p=>`L${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ') +
    ` L${pts[n-1].x.toFixed(1)},${H-P} Z`;
  const grid = [0,0.5,1].map(t=>{
    const y = H-P - t*(H-2*P);
    return `<line x1="${P}" y1="${y.toFixed(1)}" x2="${W-P}" y2="${y.toFixed(1)}" stroke="#efe6da" stroke-width="1"/>
      <text x="${P-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#a29388">${Math.round(t*maxScore)}</text>`;
  }).join('');
  const labelIdx = n<=3 ? pts.map((_,i)=>i) : [0, Math.floor((n-1)/2), n-1];
  const labels = labelIdx.map(i=>`<text x="${pts[i].x.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" fill="#a29388">${mdShort(rows[i].d)}</text>`).join('');
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="#fff" stroke="#9e1b32" stroke-width="1.6"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="全店日均分趋势">
    <defs>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9e1b32" stop-opacity=".22"/>
        <stop offset="1" stop-color="#9e1b32" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}
    <path d="${area}" fill="url(#areaGrad)" stroke="none"/>
    <path d="${line}" fill="none" stroke="#9e1b32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    ${labels}
  </svg>`;
}

function amountMetrics(){ return S.metrics.filter(m=>m.enabled && m.type==='amount'); }
function miscMetrics(){ return S.metrics.filter(m=>m.enabled && (m.type==='review' || m.type==='count')); }

function shortfallText(item){
  const m = item.m, st = item.st;
  if(m.type==='amount'){
    if(st.value==null) return m.short+' 未录';
    return m.short+' '+fmt1(st.value)+'万（占比'+fmt1(st.ratio)+'%）';
  }
  if(m.type==='review'){
    if(st.ratio==null) return '参评未录';
    return '参评 '+fmt1(st.ratio)+'%（'+st.weeksPassed+'/4周合格）';
  }
  if(m.entry==='week') return m.short+' '+st.periodsPassed+'/4周';
  if(m.entry==='half') return m.short+' '+st.periodsPassed+'/2半月';
  return m.short+' '+(st.value==null?'未录':fmt1(st.value)+'单');
}

function miscLine(x){
  const m = x.m;
  if(m.type==='review'){
    const rMonth = x.monthTotalOrders ? fmt1(x.monthReviewed/x.monthTotalOrders*100)+'%' : '—';
    const rCum = x.totalOrders ? fmt1(x.reviewed/x.totalOrders*100)+'%' : '—';
    return '- 参评率：本月 '+rMonth+'（'+x.monthReviewed+'/'+x.monthTotalOrders+' 笔，合格 '+m.threshold+'%）· 截止本周 '+rCum+'，'+x.full+' 人满分（每周2.5分）';
  }
  if(m.entry==='week'){
    return '- '+m.name+'：本月完成 '+x.periods+' 周，'+x.full+' 人满分（4周满分，每周2.5分）';
  }
  if(m.entry==='half'){
    return '- '+m.name+'：本月完成 '+x.periods+' 个半月，'+x.full+' 人满分（2个半月满分，每半月5分）';
  }
  return '- '+m.name+'：本月 '+fmt1(x.sum)+' 单，'+x.full+' 人完成（每月1单满分）';
}

function pushIssues(lines, st, maxItems){
  const issues = [];
  for(const p of st.per){
    const bad = p.d.items.filter(it=>!it.full);
    if(bad.length){
      issues.push(p.s.name+'：'+bad.slice(0,4).map(shortfallText).join('、')+(bad.length>4?' 等':''));
    }
  }
  if(!issues.length){
    lines.push('无，全部满分。');
  }else{
    issues.slice(0, maxItems||12).forEach(x=>lines.push('- '+x));
    if(issues.length>(maxItems||12)) lines.push('…另有 '+(issues.length-(maxItems||12))+' 人');
  }
}

function buildReport(type, anchor){
  if(type==='day') return buildDayReport(anchor);
  if(type==='week') return buildWeekReport(anchor);
  return buildMonthReport(anchor);
}

function buildDayReport(date){
  const st = storeStats(date);
  const activeN = st.active.length;
  const base = monthlyTarget();
  const monthText = (parseDate(date).getMonth()+1)+'月';
  const lines = [];
  lines.push('【'+S.storeName+'】'+md(date)+' 周'+weekdayCN(date)+' · '+monthText+'KPI 跟进');
  lines.push('人均月度任务：'+fmt1(base)+'万（全店 '+fmt1(base*activeN)+'万）· 全店月均分：'+fmt1(st.avg)+' / '+st.maxScore+' 分 · '+st.recorded+'/'+activeN+' 人已录');
  lines.push('');
  lines.push('一、销售金额（本月累计）');
  for(const x of st.metrics.filter(x=>x.m.type==='amount')){
    const ratio = x.ratio==null ? '—' : fmt1(x.ratio)+'%';
    lines.push('- '+x.m.name+'：全店 '+fmt1(x.sum)+'万，占比 '+ratio+'（合格 '+x.m.threshold+'%），'+x.full+'/'+activeN+' 人达标');
  }
  lines.push('');
  lines.push('二、参评率与破冰');
  for(const x of st.metrics.filter(x=>x.m.type==='review' || x.m.type==='count')){
    lines.push(miscLine(x));
  }
  lines.push('');
  lines.push('三、待跟进');
  pushIssues(lines, st, 12);
  const note = (S.notes[date]||'').trim();
  if(note){
    lines.push('');
    lines.push('四、备注');
    lines.push(note);
  }
  return lines.join('\n');
}

function buildWeekReport(anchor){
  const ws = weekStart(anchor);
  const we = addDays(ws, 6);
  const at = anchor > todayStr() ? todayStr() : anchor;
  const active = S.staff.filter(s=>s.active);
  const st = storeStats(at);
  const base = monthlyTarget();
  const activeN = active.length;
  const lines = [];
  lines.push('【'+S.storeName+'】'+md(ws)+'–'+md(we)+' 周报');
  lines.push('人均月度任务：'+fmt1(base)+'万');
  lines.push('');
  lines.push('一、本周金额（万）');
  for(const s of active){
    const parts = amountMetrics().map(m=>{
      const v = getRec(ws, s.id, m.id);
      return m.short+' '+(v===undefined||v===null||v===''?'—':fmt1(v));
    });
    lines.push('- '+s.name+'：'+parts.join(' · '));
  }
  lines.push('');
  lines.push('二、本月累计与占比');
  for(const x of st.metrics.filter(x=>x.m.type==='amount')){
    const ratio = x.ratio==null ? '—' : fmt1(x.ratio)+'%';
    lines.push('- '+x.m.name+'：全店 '+fmt1(x.sum)+'万，占比 '+ratio+'（合格 '+x.m.threshold+'%），'+x.full+'/'+activeN+' 人达标');
  }
  lines.push('');
  lines.push('三、店员本月得分');
  st.per.slice().sort((a,b)=>b.d.score-a.d.score || a.s.name.localeCompare(b.s.name,'zh')).forEach((p,i)=>{
    lines.push((i+1)+'. '+p.s.name+'：'+fmt1(p.d.score)+'/'+p.d.max+' 分');
  });
  lines.push('');
  lines.push('四、参评率（单周 / 截止本周 / 本月）');
  const rm = S.metrics.find(m=>m.enabled && m.type==='review');
  if(rm){
    for(const s of active){
      const rs = metricState(s.id, rm, at);
      const w = rs.weekRatio==null ? '—' : fmt1(rs.weekRatio)+'%';
      const c = rs.ratio==null ? '—' : fmt1(rs.ratio)+'%';
      const mo = rs.monthRatio==null ? '—' : fmt1(rs.monthRatio)+'%';
      lines.push('- '+s.name+'：本周 '+w+' · 截止 '+c+' · 本月 '+mo);
    }
  }else{
    lines.push('- 未启用');
  }
  lines.push('');
  lines.push('五、破冰');
  for(const x of st.metrics.filter(x=>x.m.type==='count')) lines.push(miscLine(x));
  lines.push('');
  lines.push('六、待跟进');
  pushIssues(lines, st, 10);
  return lines.join('\n');
}

function buildMonthReport(anchor){
  const st = storeStats(anchor);
  const activeN = st.active.length;
  const base = monthlyTarget();
  const monthText = (parseDate(anchor).getMonth()+1)+'月';
  const lines = [];
  lines.push('【'+S.storeName+'】'+monthText+' 月报');
  lines.push('人均月度任务：'+fmt1(base)+'万（全店 '+fmt1(base*activeN)+'万）· 全店月均分：'+fmt1(st.avg)+' / '+st.maxScore+' 分 · '+st.recorded+'/'+activeN+' 人已录');
  lines.push('');
  lines.push('一、销售金额（本月累计）');
  for(const x of st.metrics.filter(x=>x.m.type==='amount')){
    const ratio = x.ratio==null ? '—' : fmt1(x.ratio)+'%';
    lines.push('- '+x.m.name+'：全店 '+fmt1(x.sum)+'万，占比 '+ratio+'（合格 '+x.m.threshold+'%），'+x.full+'/'+activeN+' 人达标');
  }
  lines.push('');
  lines.push('二、参评率与破冰');
  for(const x of st.metrics.filter(x=>x.m.type==='review' || x.m.type==='count')) lines.push(miscLine(x));
  lines.push('');
  lines.push('三、店员得分与排名');
  st.per.slice().sort((a,b)=>b.d.score-a.d.score || a.s.name.localeCompare(b.s.name,'zh')).forEach((p,i)=>{
    const sale = p.d.items.find(x=>x.m.id==='salesTarget');
    const saleText = sale && sale.st.value!=null
      ? fmt1(sale.st.value)+'万/'+fmt1(base)+'万（'+fmt1(sale.st.ratio)+'%）'
      : '未录';
    lines.push((i+1)+'. '+p.s.name+'：'+fmt1(p.d.score)+'/'+p.d.max+' 分 · 总销售 '+saleText);
  });
  lines.push('');
  lines.push('四、待跟进');
  pushIssues(lines, st, 12);
  return lines.join('\n');
}

        ${m.type==='count'?`<label>破冰门槛（${esc(m.unit||'次')}）<input type="number" inputmode="numeric" step="1" min="1" max="99" value="${m.min||1}" data-set="min" data-metric="${m.id}"></label>`:''}

        <div class="full" style="font-size:11px;color:var(--ink3)">统计方式：${periodLabel(m)}${m.type==='amount'?' · 本月累计':m.type==='review'?' · 4周满分':''}</div>

  return `

      <div class="set-row">

    <div class="tip-box">金额类指标按这个任务额折算：本月累计金额 ÷ 任务额 = 完成占比。</div>

      <div class="add-staff">

  <div class="set-sec">
    <h2>指标设置</h2>
    <div class="set-card">
      ${metricRows}
      <div class="data-btns" style="border-top:1px solid var(--line2)">
        <button class="btn ghost" data-act="reset-metrics">恢复默认指标</button>

      <div class="data-btns">

/* ================= 交互 ================= */
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('on'), 2400);
}

function shiftDate(delta){
  let d = addDays(ui.date, delta);
  if(d > todayStr()) d = todayStr();
  ui.date = d;
  render();
}

function setReportType(t){
  ui.reportType = t;
  render();
}

function refreshField(staffId, metricId){
  const m = findMetric(metricId);
  if(!m) return;
  const field = document.querySelector('[data-field="'+staffId+':'+metricId+'"]');
  if(!field) return;
  const st = metricState(staffId, m, ui.date);
  const score = metricScore(m, st);
  const chip = chipInfo(m, st, score);
  const chipEl = field.querySelector('[data-chip]');
  if(chipEl){ chipEl.textContent = chip.text; chipEl.className = 'state-chip '+chip.cls; }
  const noteEl = field.querySelector('[data-note]');
  if(noteEl) noteEl.textContent = periodNote(m, st);
}

function refreshCard(staffId){
  const card = document.querySelector('.entry-card[data-staff-card="'+staffId+'"]');
  if(!card) return;
  const d = staffDaily(staffId, ui.date);
  const sc = card.querySelector('[data-card-score]');
  const pc = card.querySelector('[data-card-pass]');
  const dot = card.querySelector('[data-card-dot]');
  if(sc) sc.textContent = fmt1(d.score);
  if(pc) pc.textContent = d.passCount+'/'+d.total;
  if(dot) dot.classList.toggle('ok', d.recorded);
  S.metrics.filter(m=>m.enabled).forEach(m=>refreshField(staffId, m.id));
}

function onAmountInput(input){
  const staffId = input.dataset.staff;
  const metricId = input.dataset.metric;
  const m = findMetric(metricId);
  if(!m) return;
  const key = entryKey(m, ui.date);
  const raw = input.value;
  if(raw===''){ setRec(key, staffId, metricId, null); }
  else{
    let v = Number(raw);
    if(isNaN(v)) return;
    v = clamp(v, 0, 9999);
    if(Number(raw) < 0) input.value = '0';
    setRec(key, staffId, metricId, v);
  }
  refreshField(staffId, metricId);
  refreshCard(staffId);
  saveSoon();
}

function onCountInput(input){
  const staffId = input.dataset.staff;
  const metricId = input.dataset.metric;
  const m = findMetric(metricId);
  if(!m) return;
  const key = entryKey(m, ui.date);
  const raw = input.value;
  if(raw===''){ setRec(key, staffId, metricId, null); }
  else{
    let v = Math.floor(Number(raw));
    if(isNaN(v)) return;
    v = clamp(v, 0, 999);
    if(Number(raw) < 0) input.value = '0';
    setRec(key, staffId, metricId, v);
  }
  refreshField(staffId, metricId);
  refreshCard(staffId);
  saveSoon();
}

function onReviewInput(input, field){
  const staffId = input.dataset.staff;
  const metricId = input.dataset.metric;
  const m = findMetric(metricId);
  if(!m) return;
  const key = entryKey(m, ui.date);
  const curRaw = getRec(key, staffId, metricId);
  const cur = (curRaw && typeof curRaw==='object')
    ? { total:Number(curRaw.total)||0, reviewed:Number(curRaw.reviewed)||0 }
    : { total:0, reviewed:0 };
  const v = input.value==='' ? 0 : clamp(Math.floor(Number(input.value)||0), 0, 9999);
  if(field==='total'){
    cur.total = v;
    if(cur.reviewed > cur.total) cur.reviewed = cur.total;
  }else{
    cur.reviewed = v;
    if(cur.total>0 && cur.reviewed > cur.total){ cur.reviewed = cur.total; input.value = cur.total; }
  }
  if(!cur.total && !cur.reviewed) setRec(key, staffId, metricId, null);
  else setRec(key, staffId, metricId, { total:cur.total, reviewed:cur.reviewed });
  const fieldEl = input.closest('[data-field]');
  if(fieldEl){
    const other = fieldEl.querySelector(field==='total' ? '[data-in="reviewReviewed"]' : '[data-in="reviewTotal"]');
    if(other) other.value = field==='total' ? (cur.reviewed||'') : (cur.total||'');
  }
  refreshField(staffId, metricId);
  refreshCard(staffId);
  saveSoon();
}

function clearWeek(){
  const key = weekStart(ui.date);
  if(!confirm('清空本周（'+weekLabel(ui.date)+'）所有店员的销售、参评和周二换金录入？')) return;
  delete S.records[key];
  delete S.notes[ui.date];
  saveNow();
  render();
  toast('已清空本周录入');
}

function clearAll(){
  if(!confirm('会清空所有日期的录入和备注，店员和指标设置保留。建议先导出备份。继续？')) return;
  if(!confirm('再确认一次：所有历史数据将被删除，无法找回（快照里可能还有最近一份）。')) return;
  S.records = {};
  S.notes = {};
  saveNow();
  render();
  toast('已清空所有记录');
}

function addStaff(){
  const inp = $('#newStaffName');
  if(!inp) return;
  const name = inp.value.trim();
  if(!name){ toast('先输入姓名'); return; }
  if(S.staff.some(s=>s.name===name)){ toast('这个名字已经有了'); return; }
  let n = 1;
  while(S.staff.some(s=>s.id==='s'+n)) n++;
  S.staff.push({ id:'s'+n, name, active:true });
  saveNow();
  render();
  toast('已添加 '+name);
}

function deleteStaff(id){
  const s = findStaff(id);
  if(!s) return;
  if(!confirm('删除店员「'+s.name+'」？历史记录会保留，但排行和录入里不再显示。')) return;
  S.staff = S.staff.filter(x=>x.id!==id);
  saveNow();
  render();
  toast('已删除');
}

function moveStaff(id, dir){
  const i = S.staff.findIndex(s=>s.id===id);
  const j = i + dir;
  if(i<0 || j<0 || j>=S.staff.length) return;
  const tmp = S.staff[i];
  S.staff[i] = S.staff[j];
  S.staff[j] = tmp;
  saveNow();
  render();
}

function resetMetrics(){
  if(!confirm('把 10 项指标的合格线、门槛、分值恢复成默认？已录数据不受影响。')) return;
  S.metrics = DEFAULT_METRICS.map(m=>({...m}));
  saveNow();
  render();
  toast('已恢复默认指标');
}

function exportJSON(){
  const payload = {
    app:'ctf-kpi', version:APP_VERSION, exportedAt:new Date().toISOString(),
    state:S
  };
  download(JSON.stringify(payload,null,2), 'ctf-kpi-backup-'+todayStr().replace(/-/g,'')+'.json', 'application/json');
  toast('备份已导出，存到微信收藏或电脑');
}

function exportCSV(){
  const metricNames = S.metrics.map(m=>{
    if(m.type==='amount') return m.name+'（万）';
    if(m.type==='count') return m.name+'（'+(m.unit||'次')+'）';
    if(m.type==='review') return m.name+'（参评/总）';
    return m.name;
  });
  const rows = [['周起始日','店员',...metricNames]];
  const dates = Object.keys(S.records).sort();
  for(const d of dates){
    for(const s of S.staff){
      const r = S.records[d] && S.records[d][s.id];
      if(!r) continue;
      const vals = S.metrics.map(m=>{
        const v = r[m.id];
        if(v===undefined||v===null) return '';
        if(m.type==='review'){
          if(!v || typeof v!=='object') return '';
          return (Number(v.reviewed)||0)+'/'+(Number(v.total)||0);
        }
        return v;
      });
      if(vals.some(v=>v!=='')) rows.push([d,s.name,...vals]);
    }
  }
  const csv = '﻿' + rows.map(r=>r.map(c=>{
    const s = String(c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  download(csv, 'ctf-kpi-'+todayStr()+'.csv', 'text/csv;charset=utf-8');
  toast('Excel 数据已导出');
}

function download(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function importJSONFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(reader.result);
      const state = obj && obj.state ? obj.state : obj;
      if(!state || typeof state!=='object' || !state.records || !Array.isArray(state.staff)){
        throw new Error('格式不对');
      }
      if(!confirm('导入会覆盖当前所有数据。确定继续？')) return;
      maybeSnapshot(true);
      S = migrateState(state);
      saveNow();
      render();
      toast('导入成功');
    }catch(e){
      console.error(e);
      alert('导入失败：文件不是有效的备份。');
    }
  };
  reader.readAsText(file);
}

function restoreSnap(idx){
  const snaps = getSnaps();
  const snap = snaps[idx];
  if(!snap) return;
  if(!confirm('恢复到 '+new Date(snap.t).toLocaleString('zh-CN')+' 的快照？当前数据会被覆盖。')) return;
  try{
    const state = JSON.parse(snap.data);
    maybeSnapshot(true);
    S = migrateState(state);
    saveNow();
    render();
    toast('已恢复快照');
  }catch(e){
    alert('快照损坏，无法恢复');
  }
}

async function copyReport(){
  const ta = $('#reportText');
  if(!ta) return;
  const text = ta.textContent;
  try{
    await navigator.clipboard.writeText(text);
    toast('已复制，去微信粘贴吧');
  }catch(e){
    const t = document.createElement('textarea');
    t.value = text;
    t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); toast('已复制，去微信粘贴吧'); }
    catch(err){ toast('复制失败，请长按文字手动复制'); }
    t.remove();
  }
}

function downloadReport(){
  const ta = $('#reportText');
  if(!ta) return;
  const typeName = ui.reportType==='day'?'日报':ui.reportType==='week'?'周报':'月报';
  download(ta.textContent, '周大福KPI-'+typeName+'-'+ui.date+'.txt', 'text/plain;charset=utf-8');
  toast('已下载');
}

async function checkUpdate(){
  try{
    const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('http');
    const j = await r.json();
    if(j.version && j.version !== APP_VERSION){
      if(confirm('发现新版本 v'+j.version+'。重新打开后更新，现在刷新吗？')) location.reload();
    }else{
      toast('已是最新版本 v'+APP_VERSION);
    }
  }catch(e){
    toast('联网检查失败，当前版本 v'+APP_VERSION);
  }
}

function openStaffSheet(staffId){
  const s = findStaff(staffId);
  if(!s) return;
  const d = staffDaily(staffId, ui.date);
  const rows = d.items.map(x=>{
    const m = x.m, st = x.st;
    const cls = x.full ? 'ok' : (x.score>0 ? 'warn' : (st.status==='pending' ? '' : 'bad'));
    let val = '';
    if(m.type==='amount'){
      val = st.value==null ? '未填' : fmt1(st.value)+'万 · '+fmt1(st.ratio)+'%';
    }else if(m.type==='review'){
      const w = st.weekRatio==null ? '—' : fmt1(st.weekRatio)+'%';
      const c = st.ratio==null ? '—' : fmt1(st.ratio)+'%';
      const mo = st.monthRatio==null ? '—' : fmt1(st.monthRatio)+'%';
      val = '本周 '+w+'<br>截止 '+c+' · 本月 '+mo;
    }else if(m.type==='count'){
      if(m.entry==='week') val = (st.periodsPassed||0)+'/4周';
      else if(m.entry==='half') val = (st.periodsPassed||0)+'/2半月';
      else val = st.value==null ? '未填' : fmt1(st.value)+'单';
    }else{
      val = st.value!=null ? fmt1(st.value)+'%' : '未填';
    }
    let sub = '';
    if(m.type==='amount') sub = '按周录 · 合格≥'+m.threshold+'% · 本月'+(st.weeksRecorded||0)+'周';
    else if(m.type==='review') sub = '按周录 · 每周≥'+m.threshold+'% · 合格'+(st.weeksPassed||0)+'/4周';
    else if(m.type==='count') sub = (m.entry==='week'?'每周':m.entry==='half'?'每半月':'每月')+' · ≥'+(m.min||1)+(m.unit||'');
    else sub = periodLabel(m);
    return `
    <div class="detail-row">
      <div class="dr-main"><b>${esc(m.name)}</b><span>${sub}</span></div>
      <div class="dr-val ${cls}">${val}<small>${fmt1(x.score)}/${m.score||0} 分</small></div>
    </div>`;
  }).join('');
  openSheet(`
    <div class="sheet-bar"><h3>店员详情</h3><button class="x" data-act="close-sheet">×</button></div>
    <div class="sheet-body">
      <div class="detail-head">
        <span class="avatar">${esc(s.name.slice(0,1))}</span>
        <div><b style="font-size:15px">${esc(s.name)}</b><div class="hint">${md(ui.date)} 周${weekdayCN(ui.date)}</div></div>
        <div class="big-score"><b>${d.recorded?fmt1(d.score):'—'}</b><span>/ ${d.max} 分</span></div>
      </div>
      ${rows}
      <div class="btn-row" style="margin-top:14px">
        <button class="btn ghost" data-act="close-sheet">关闭</button>
        <button class="btn primary" data-act="edit-staff" data-staff="${s.id}">去录入</button>
      </div>
    </div>`);
}
